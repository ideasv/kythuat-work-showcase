     khác nhau ở BÓNG NGOÀI, không chỉ khác ở chi tiết bên trong. Luật đúc:
     khung 24, nét 2, chỉ đoạn thẳng · góc vuông · cung tròn trọn vẹn, không
     đường cong tự do · không bo góc. Mượn hình chung chung là chỗ bệnh cũ:
     nhóm Thiết bị từng đeo ngọn lửa, mà ngọn lửa vẽ nét mảnh thì trông y hệt
